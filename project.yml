name: Islander

options:
  bundleIdPrefix: com.kadaliao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.2.6"
    CURRENT_PROJECT_VERSION: "9"

targets:
  Islander:
    type: application
    platform: macOS
    sources:
      - path: Islander
    info:
      path: Islander/App/Info.plist
      properties:
        CFBundleName: Islander
        CFBundleDisplayName: 岛民
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        # 默认不进 Dock；启动时按设置（AppSettings.showInDock）切换
        LSUIElement: true
        NSHumanReadableCopyright: © 2026 Kada Liao
    settings:
      base:
        PRODUCT_NAME: Islander
        PRODUCT_BUNDLE_IDENTIFIER: com.kadaliao.islander
        # 不开沙盒：需要屏幕录制、辅助功能、跨进程读菜单栏窗口
        ENABLE_APP_SANDBOX: NO
        # 公证要求 hardened runtime，开发期也保持一致
        ENABLE_HARDENED_RUNTIME: YES
        # 固定证书签名：屏幕录制 / 辅助功能授权跟签名绑定，ad-hoc 签名每次构建都会失效
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HMDAVG9B8J
        CODE_SIGN_IDENTITY: Apple Development
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
